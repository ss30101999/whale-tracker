name: Whale Tracker

on:
  schedule:
    - cron: "*/5 * * * *"   # har 5 minute me chalega
  workflow_dispatch: {}      # manually bhi run kar sakte ho "Run workflow" button se

# Prevent overlapping runs from racing each other on the same state.json
concurrency:
  group: whale-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 whale_tracker.py

      - name: Commit updated state
        run: |
          git config user.name "whale-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet && exit 0
          git commit -m "update state"
          git pull --rebase origin main
          git push
